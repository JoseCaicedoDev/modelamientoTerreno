<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Modelo 3D interactivo del terreno del área Manolo, generado a partir del DEM SRTMGL1 incluido en el producto ALOS PALSAR RTC.">
  <title>Manolo - Modelo 3D de Elevación</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c2027'/%3E%3Cpath d='M8 48 25 18l9 15 8-11 14 26Z' fill='%2378d4a5'/%3E%3Cpath d='M8 48h48' stroke='%23f2b35f' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="title-block">
        <p class="eyebrow">MANOLO · EPSG:32620</p>
        <h1>Modelo 3D de elevación</h1>
      </div>
      <div class="summary" aria-label="Resumen del modelo">
        <span><strong>0-54 m</strong> elevación</span>
        <span><strong>30 m</strong> resolución nominal</span>
        <span><strong>10 m</strong> curvas</span>
      </div>
    </header>

    <section class="viewer" aria-label="Visor tridimensional del terreno">
      <div id="terrain-plot" role="img" aria-label="Superficie tridimensional interactiva del terreno"></div>

      <aside class="controls" aria-label="Controles del modelo">
        <div class="control-group">
          <span class="control-label">Coloración</span>
          <div class="segmented" role="group" aria-label="Coloración de la superficie">
            <button class="segmented-button active" data-color-mode="elevation" type="button">Elevación</button>
            <button class="segmented-button" data-color-mode="shade" type="button">Relieve</button>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label" for="exaggeration">Exageración vertical <output id="exaggeration-value">5×</output></label>
          <input id="exaggeration" type="range" min="1" max="10" step="1" value="5">
        </div>

        <div class="button-row">
          <button id="contours-toggle" class="utility-button active" type="button" aria-pressed="true">Curvas 10 m</button>
          <button id="reset-camera" class="utility-button" type="button">Restablecer vista</button>
        </div>
      </aside>

      <div class="source-note">DEM SRTMGL1 · ALOS PALSAR RTC ALPSRP274680160</div>
      <div id="touch-hint" class="touch-hint">Arrastra para rotar · Pellizca para acercar</div>
      <div id="loading" class="loading" aria-live="polite">
        <div class="loading-mark"></div>
        <span>Preparando terreno 3D…</span>
      </div>
      <div id="error" class="error" hidden>No se pudo cargar el visor 3D. Revisa la conexión e inténtalo de nuevo.</div>
    </section>
  </main>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="./terrain-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
